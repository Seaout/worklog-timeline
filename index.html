<html lang="zh-CN">
<head>

<title>工作时间轴</title>
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}input,textarea,select{background:var(--field);color:var(--text);border:1px solid var(--grid);border-radius:7px;padding:8px;min-width:0}textarea{resize:vertical}button{background:var(--panel);color:var(--text);border:1px solid var(--grid);border-radius:7px;padding:7px 11px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cursor);outline-offset:1px}.primary{background:var(--accent);border-color:var(--accent);color:#16212c;font-weight:700}.quiet{background:transparent}.danger{color:var(--today)}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.app{display:flex;flex-direction:column;height:100dvh;min-height:400px;overflow:hidden}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--grid);background:var(--panel);z-index:8}.toolbar #workspace-name{width:166px;font-weight:700}.toolbar .grow{flex:1}.toolbar .search-field{width:225px}.status{font-size:12px;white-space:nowrap;color:var(--muted)}.status.dirty{color:var(--halted)}.workspace{display:flex;flex:1;min-height:0}.left{display:flex;flex-direction:column;min-width:260px;flex:1;overflow:hidden}.timeline-panel{display:flex;flex-direction:column;min-height:120px;flex:1;background:var(--panel)}.timeline-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--grid)}.timeline-actions .grow{flex:1}.timeline-actions input[type=date]{width:147px}.timeline-actions select{width:83px}.timeline-scroll{flex:1;min-height:0;overflow:auto;background:var(--bg);scrollbar-color:var(--grid) transparent;scrollbar-width:thin}.timeline-scroll::-webkit-scrollbar,.details::-webkit ;background-size:var(--day-px) 100%;background-position:left top;cursor:grab}.track-body.panning{cursor:grabbing}.task-bar{position:absolute;height:28px;padding:4px 9px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#14202b;font-weight:700;box-shadow:0 2px 5px var(--shadow);border:2px solid transparent;cursor:pointer}.task-bar.selected{border-color:var(--text);z-index:2}.task-bar[data-status=ongoing]{background:var(--ongoing)}.task-bar[data-status=halted]{background:var(--halted)}.task-bar[data-status=failed]{background:var(--failed)}.task-bar[data-status=completed]{background:var(--completed)}.empty-lane{position:absolute;top:17px;left:15px;color:var(--muted);pointer-events:none}.split-v{height:9px;flex:none;background:var(--bg);cursor:row-resize;position:relative}.split-h{width:9px;flex:none;background:var(--bg);cursor:col-resize;position:relative}.split-v:after,.split-h:after{content:'';position:absolute;background:var(--muted);border-radius:3px;opacity:.6}.split-v:after{width:48px;height:3px;left:calc(50% - 24px);top:3px}.split-h:after{height:48px;width:3px;top:calc(50% - 24px);left:3px}.details{height:35%;min-height:52px;overflow:auto;padding:12px 15px;background:var(--panel);container-type:inline-size}.details.collapsed{height:52px!important;overflow:hidden}.details-head,.journal-head{display:flex;gap:8px;align-items:center}.details-head h2,.journal-head h2{font-size:16px;margin:0}.details-head .grow,.journal-head .grow{flex:1}.details-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:12px}.details-col{min-width:0}.details-col h3,.log-block h3{font-size:14px;margin:0 0 7px;color:var(--accent)}.task-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field.wide{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:90px}.sub-item{display:flex;align-items:center;gap:7px;margin-bottom:7px}.sub-item input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--completed)}.sub-item input[type=text]{flex:1}.sub-item button{padding:5px 8px}.details-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}.journal{width:30%;min-width:280px;max-width:55vw;padding:14px;overflow:auto;background:var(--panel);scrollbar-color:var(--grid) transparent;scrollbar-width:thin}.journal.collapsed{width:42px!important;min-width:42px;padding:8px 3px;overflow:hidden}.journal.collapsed>*:not(.journal-head){display:none}.journal.collapsed .journal-head{writing-mode:vertical-rl;gap:8px}.journal.collapsed .journal-head>*:not(#journal-toggle){display:none}.journal-date{display:flex;align-items:center;gap:5px;margin:13px 0}.journal-date input{flex:1}.journal-date button{white-space:nowrap}.related{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}.related button{font-size:12px;padding:4px 7px}.log-block{margin:13px 0}.entries{display:flex;flex-direction:column;gap:6px}.entry{display:flex;align-items:flex-start;gap:6px}.entry .number{width:20px;flex:none;color:var(--muted);padding-top:8px;text-align:right}.entry textarea{flex:1;min-height:39px;resize:vertical}.entry button{padding:7px}.log-block>button{margin:7px 0 0 26px}.notes{width:100%;min-height:110px}.result-panel{position:fixed;top:58px;right:15px;width:min(510px,calc(100vw - 30px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:12px;z-index:15;box-shadow:0 14px 35px var(--shadow)}.result-row{display:block;width:100%;text-align:left;margin:5px 0;padding:9px;white-space:normal;word-break:break-word}.result-row mark{background:var(--halted);color:#111}.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:9px 0}.tabs button.active{border-color:var(--accent);color:var(--accent)}.modal-cover{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30;padding:15px}.modal{width:min(550px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px}.modal h2{font-size:18px;margin:0 0 15px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color-field{display:flex;justify-content:space-between;align-items:center;gap:8px}.color-field input{width:66px;height:38px;padding:3px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;background:var(--panel);padding:10px 15px;border:1px solid var(--accent);border-radius:8px;box-shadow:0 5px 20px var(--shadow)}
@container (max-width:740px){.details-grid{grid-template-columns:1fr}.task-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}@container (max-width:430px){.task-fields{grid-template-columns:1fr}}@media(max-width:700px){.toolbar{gap:5px}.toolbar .search-field{width:150px}.journal{min-width:200px}.left{min-width:180px}.timeline-actions{gap:4px}.ruler-corner,.track-name{width:116px}}
/* 表单颜色统一跟随主题，日期选择器使用对应的浏览器控件颜色。 */
input,textarea,select{background-color:var(--field);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
select option{background-color:var(--panel);color:var(--text)}
input:-webkit-autofill{-webkit-text-fill-color:var(--text);-webkit-box-shadow:0 0 0 1000px var(--field) inset}
.range-controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap;border-left:1px solid var(--grid);padding-left:9px}
.range-controls label{color:var(--muted);font-size:12px;white-space:nowrap}
.range-controls input[type=date]{width:137px}
.timeline-actions .zoom-controls{display:flex;align-items:center;gap:5px;white-space:nowrap}
.zoom-controls input[type=range]{width:132px;padding:0;border:0;background:transparent;accent-color:var(--cursor);cursor:pointer}
.zoom-controls button{width:28px;height:32px;padding:0;font-size:18px;line-height:1}
.phase-swatch,#phase-color{width:22px!important;height:22px!important;min-width:22px;flex:none;padding:0!important;border:1px solid var(--grid);border-radius:4px;cursor:pointer;appearance:none;background:none}
.phase-swatch::-webkit-color-swatch-wrapper,#phase-color::-webkit-color-swatch-wrapper{padding:0}
.phase-swatch::-webkit-color-swatch,#phase-color::-webkit-color-swatch{border:0;border-radius:3px}
.phase-swatch::-moz-color-swatch,#phase-color::-moz-color-swatch{border:0;border-radius:3px}
.phase-color-field{display:flex;align-items:center;gap:10px}
.toolbar #save{background:var(--save-color);border-color:var(--save-color);color:var(--save-text)}
.timeline-actions #add-task{background:var(--task-color);border-color:var(--task-color);color:var(--task-text)}
.details-col h3,.log-block h3{color:var(--text)}
.build-badge{border:1px solid var(--cursor);color:var(--cursor);border-radius:6px;padding:5px 7px;font-size:12px;white-space:nowrap}
.month-span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ruler-corner{z-index:12}
.track-name{z-index:6}
.day-tick{top:29px;transform:none;height:25px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.day-tick.week-start{font-weight:800;color:var(--text)}
.day-tick.selected{z-index:3;min-width:24px;padding:0 2px;border-radius:5px;background:var(--cursor);color:#15232e;font-weight:800;box-shadow:0 1px 5px var(--shadow)}
.day-tick.today-label:not(.selected){color:var(--today);font-weight:700}
.track-body{overflow:hidden}
.week-divider,.cursor-track-line,.today-track-line{position:absolute;top:0;bottom:0;pointer-events:none}
.week-divider{border-left:1px solid var(--month);opacity:.45;z-index:0}
.cursor-track-line{width:2px;background:var(--cursor);z-index:1}
.today-track-line{width:2px;background:var(--today);opacity:.8;z-index:1}
.task-bar{z-index:2}
.task-bar.selected{z-index:3}
.task-bar,.phase-handle{touch-action:none;user-select:none}
.task-bar{cursor:grab}
.task-bar:active,.phase-handle:active{cursor:grabbing}
.phase-handle{flex:none;width:20px;padding:4px 1px;line-height:1.1;border:0;background:transparent;color:var(--muted);cursor:grab}
.task-resize-handle{position:absolute;top:0;bottom:0;width:9px;z-index:4;cursor:ew-resize;touch-action:none}
.task-resize-handle.start{left:0}.task-resize-handle.end{right:0}
.drag-ghost{position:fixed!important;z-index:40!important;pointer-events:none;opacity:.88;box-shadow:0 8px 24px var(--shadow);border:2px solid var(--cursor)!important}
.drag-caption{position:fixed;z-index:41;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--cursor);border-radius:6px;padding:4px 7px;font-size:12px;white-space:nowrap;box-shadow:0 4px 12px var(--shadow)}
.phase-ghost{background:var(--panel);color:var(--text);border-radius:7px;padding:9px;white-space:nowrap}
.lane-drop{position:absolute;left:2px;right:2px;height:31px;border:2px dashed var(--cursor);border-radius:6px;pointer-events:none;z-index:5;background:color-mix(in srgb,var(--cursor) 17%,transparent)}
.lane-drop.new{height:10px;background:var(--cursor)}
.phase-drop{outline:2px dashed var(--cursor);outline-offset:-3px}
.ruler{cursor:grab;user-select:none;-webkit-user-select:none}
.ruler:active{cursor:grabbing}
.ruler *{user-select:none;-webkit-user-select:none}
.related-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.related-head button{padding:2px 8px}
.related.collapsed{display:none}
.display-scale{display:flex;align-items:center;gap:9px;margin:9px 0}
.display-scale label{min-width:70px}.display-scale input{flex:1;padding:0}.display-scale output{min-width:40px;text-align:right}
body{font-size:calc(14px * var(--font-scale,1))}
button{padding:calc(7px * var(--ui-scale,1)) calc(11px * var(--ui-scale,1));border-radius:calc(7px * var(--ui-scale,1))}
input,textarea,select{padding:calc(8px * var(--ui-scale,1));border-radius:calc(7px * var(--ui-scale,1))}
.toolbar{gap:calc(8px * var(--ui-scale,1));padding:calc(10px * var(--ui-scale,1)) calc(14px * var(--ui-scale,1))}
.toolbar #workspace-name{width:calc(166px * var(--ui-scale,1))}
.toolbar .search-field{width:calc(225px * var(--ui-scale,1))}
.timeline-actions{gap:calc(7px * var(--ui-scale,1));padding:calc(9px * var(--ui-scale,1)) calc(12px * var(--ui-scale,1))}
.timeline-actions input[type=date]{width:calc(147px * var(--ui-scale,1))}
.details{padding:calc(12px * var(--ui-scale,1)) calc(15px * var(--ui-scale,1))}
.details-grid{gap:calc(16px * var(--ui-scale,1));margin-top:calc(12px * var(--ui-scale,1))}
.task-fields{gap:calc(9px * var(--ui-scale,1))}
.field{gap:calc(4px * var(--ui-scale,1))}
.field textarea{min-height:calc(90px * var(--ui-scale,1))}
.sub-item{gap:calc(7px * var(--ui-scale,1));margin-bottom:calc(7px * var(--ui-scale,1))}
.details-footer{gap:calc(8px * var(--ui-scale,1));margin-top:calc(13px * var(--ui-scale,1))}
.journal{padding:calc(14px * var(--ui-scale,1))}
.journal-date{gap:calc(5px * var(--ui-scale,1));margin:calc(13px * var(--ui-scale,1)) 0}

.sub-item button{padding:calc(5px * var(--ui-scale,1)) calc(8px * var(--ui-scale,1))}
.notes{min-height:calc(110px * var(--ui-scale,1))}
.details-head h2,.journal-head h2{font-size:calc(16px * var(--font-scale,1))}

</style>

<body>
<div class="app">
<header class="toolbar">
<input id="workspace-name" aria-label="工作区名称" value="研究生工作记录" title="工作区名称"><span class="build-badge">修订版 09·28 v4</span>
<button id="new-project" class="quiet">新建</button><button id="save" class="primary" title="Ctrl+S">保存 JSON</button><button id="import">导入 JSON</button><button id="export-md" class="quiet">导出 Markdown</button><input id="file-input" type="file" accept=".json,application/json" multiple class="hidden">
<span class="grow"></span>
<a id="project-info"
   class="toolbar-link"
   href="https://github.com/Seaout/worklog-timeline"
   target="_blank"
   rel="noopener noreferrer"
   title="查看项目说明">说明</a>
<input class="search-field" id="search" placeholder="搜索任务、每日记录…" aria-label="全局搜索" title="Ctrl+F">
<button id="settings" title="主题与颜色">设置</button>
<span id="save-status" class="status">尚未保存</span>
</header>
<div class="workspace" id="workspace">
<div class="left" id="left">
<section class="timeline-panel" id="timeline-panel">
<div class="timeline-actions"><button id="add-phase">＋ 阶段</button><button id="add-task" class="primary">＋ 任务</button><div class="range-controls"><label for="view-start">显示起点</label><input type="date" id="view-start"><label for="view-end">显示终点</label><input type="date" id="view-end"><button id="set-range">设定范围</button></div><span class="grow"></span><button id="prev-day" title="前一天">‹</button><button id="jump-today">今天</button><button id="next-day" title="后一天">›</button><label for="axis-date" class="small muted">查看日期</label><input type="date" id="axis-date" aria-label="查看日期"><div class="zoom-controls"><label for="zoom-slider" class="small muted">缩放</label><button id="zoom-out" title="缩小时间轴" aria-label="缩小时间轴">−</button><input type="range" id="zoom-slider" min="0" max="100" step="1" aria-label="时间轴缩放"><button id="zoom-in" title="放大时间轴" aria-label="放大时间轴">＋</button></div></div>
<div class="timeline-scroll" id="timeline-scroll"><div class="ruler-row" id="ruler-row"><div class="ruler-corner">阶段 / 日期</div><div class="ruler" id="ruler"></div></div><div id="tracks"></div></div>
</section><div id="split-v" class="split-v" role="separator" aria-label="调整任务详情高度" tabindex="0"></div>
<section class="details" id="details"><div class="details-head"><h2>任务详情</h2><span id="detail-hint" class="small muted">选中时间轴上的任务</span><span class="grow"></span><button id="detail-toggle" class="quiet" title="收起或展开">收起</button></div><div id="detail-content"></div></section>
</div><div id="split-h" class="split-h" role="separator" aria-label="调整每日日志宽度" tabindex="0"></div>
<aside class="journal" id="journal"><div class="journal-head"><h2>每日记录</h2><span class="grow"></span><button id="journal-toggle" class="quiet" title="收起或展开">收起</button></div><div class="journal-date"><button id="journal-prev" title="前一天">‹</button><input type="date" id="journal-date" aria-label="记录日期"><button id="journal-today">今天</button><button id="journal-next" title="后一天">›</button></div><div class="related-head"><span class="small muted" id="related-title">当日相关任务</span><button id="related-toggle" class="quiet" type="button" aria-controls="related" aria-expanded="true" title="收起当日相关任务">⌃</button></div><div class="related" id="related"></div><button id="copy-yesterday" class="quiet">载入昨日计划 → 今日完成</button><div id="log-fields"></div></aside>
</div></div>
<div id="search-results" class="result-panel hidden"></div><div id="modal-cover" class="modal-cover hidden"><div id="modal" class="modal"></div></div><div id="toast" class="toast hidden" role="status"></div>
<script>

  swatch.onchange=()=>mutate(()=>{p.color=swatch.value;p.updatedAt=stamp()});
  const btn=document.createElement('button');btn.className='phase-edit';btn.textContent=p.phaseName;btn.title=tr('编辑阶段名称','Edit phase name');btn.onclick=()=>showPhaseModal(p);label.append(handle,swatch,btn);

  for(const t of p.tasks){
   if(!validDate(t.startTime)||!validDate(t.endTime)||t.endTime<viewStart||t.startTime>viewEnd)continue;
   const rowIndex=p.lanes.indexOf(t.laneId);if(rowIndex<0)continue;

   bar.dataset.status=statuses[t.status]?t.status:'ongoing';bar.dataset.id=String(t.id);
   bar.style.left=dayDiff(viewStart,t.startTime)*scale+'px';bar.style.top=(12+rowIndex*lanePitch())+'px';

   bindTaskDrag(bar,t,p);

function pasteCopiedTask(){
 if(!copiedTask)return false;
 const phase=data.timelineData.find(p=>String(p.id)===String(copiedTask.phaseId));
 if(!phase){notify(tr('原阶段已删除，无法粘贴任务','The original phase was deleted; cannot paste the task'));return true}
 const task=clone(copiedTask.task),id=uid();
 task.id=id;task.startTime=viewDate;task.endTime=addDays(viewDate,dayDiff(copiedTask.task.startTime,copiedTask.task.endTime));task.updatedAt=stamp();
 task.subTasks=(task.subTasks||[]).map(sub=>({...sub,id:uid(),updatedAt:stamp()}));
 mutate(()=>{
  const originalLane=copiedTask.task.laneId;
  if(phase.lanes.includes(originalLane)&&canShareLane(phase,originalLane,null,task.startTime,task.endTime))task.laneId=originalLane;
  else{task.laneId=uid();const originalIndex=phase.lanes.indexOf(originalLane);phase.lanes.splice(originalIndex<0?phase.lanes.length:originalIndex+1,0,task.laneId)}
  phase.tasks.push(task);
 });

 if(task.endTime>viewEnd)viewEnd=task.endTime;
 syncView();selectTask(id);
 notify(tr('已粘贴任务','Task pasted'));return true
}

  out+=`\n### ${p.phaseName}\n`;
  for(const t of [...p.tasks].sort((a,b)=>p.lanes.indexOf(a.laneId)-p.lanes.indexOf(b.laneId)||a.startTime.localeCompare(b.startTime))){
   out+=tr(`\n- ${t.name}（${t.startTime}—${t.endTime}，${statusLabel(t.status)}）\n`,`\n- ${t.name} (${t.startTime}–${t.endTime}, ${statusLabel(t.status)})\n`);
   if(t.description)out+=`  ${t.description.replaceAll('\n','\n  ')}\n`;
   for(const sub of t.subTasks)out+=`  - ${sub.status==='completed'?'[x]':'[ ]'} ${sub.text}\n`
  }
 }
 out+=`\n## ${tr('每日记录','Daily journal')}\n`;
 for(const date of Object.keys(data.dailyLogs).sort()){
  const log=data.dailyLogs[date];out+=`\n### ${date}\n`;
  for(const key of ['completed','issues','plans']){out+=`\n**${logLabel(key)}**\n`;for(const [i,e] of (log[key]||[]).entries())if(e.text)out+=`${i+1}. ${e.text}\n`}
  if(log.notes)out+=`\n**${logLabel('notes')}**\n\n${log.notes}\n`
 }
 download(safeName(data.projectName)+'.md',out,'text/markdown;charset=utf-8')
}
function normalize(obj){
 if(!obj||!Array.isArray(obj.timelineData))throw Error(tr('缺少阶段和任务数据','Missing phase and task data'));
 const out={version:5,projectName:String(obj.projectName||tr('工作记录','Work record')),phaseOrderUpdatedAt:String(obj.phaseOrderUpdatedAt||''),timelineData:[],dailyLogs:{}};
 for(const p of obj.timelineData){
  if(!p||!Array.isArray(p.tasks))throw Error(tr('阶段数据不完整','Incomplete phase data'));
  const phase={...p,id:p.id??uid(),phaseName:String(p.phaseName||tr('未命名阶段','Unnamed phase')),color:/^#[0-9a-f]{6}$/i.test(p.color)?p.color:'#879cad',lanes:Array.isArray(p.lanes)?p.lanes.filter(id=>typeof id==='string'):[],updatedAt:p.updatedAt||'',tasks:[]};
  for(const t of p.tasks){
   if(!validDate(t.startTime)||!validDate(t.endTime)||t.startTime>t.endTime)throw Error(tr('任务日期无效','Invalid task dates'));
   const {assignee,link,...taskFields}=t;
   const legacy=[assignee!=null&&String(assignee).trim()?`负责人：${assignee}`:'',link!=null&&String(link).trim()?`链接：${link}`:''].filter(Boolean);
   const description=[String(t.description||''),...legacy].filter(Boolean).join('\n\n');
   phase.tasks.push({...taskFields,id:t.id??uid(),name:String(t.name||tr('未命名任务','Unnamed task')),description,status:statuses[t.status]?t.status:'ongoing',startTime:t.startTime,endTime:t.endTime,laneId:typeof t.laneId==='string'?t.laneId:'',subTasks:Array.isArray(t.subTasks)?t.subTasks.map(sub=>({...sub,id:sub.id??uid(),text:String(sub.text||''),status:statuses[sub.status]?sub.status:'ongoing'})):[],updatedAt:t.updatedAt||''});
  }
  if(!Array.isArray(p.lanes)){
   const ends=[];
   for(const task of [...phase.tasks].sort((a,b)=>a.startTime.localeCompare(b.startTime)||String(a.id).localeCompare(String(b.id)))){
    let i=ends.findIndex(end=>end<task.startTime);if(i<0){i=ends.length;ends.push(task.endTime);phase.lanes.push('legacy:'+String(phase.id)+':'+i)}else ends[i]=task.endTime;
    task.laneId=phase.lanes[i];
   }
  }
  reconcileLanes(phase);out.timelineData.push(phase);
 }
 if(obj.dailyLogs&&typeof obj.dailyLogs==='object'&&!Array.isArray(obj.dailyLogs))for(const [date,log] of Object.entries(obj.dailyLogs)){
  if(!validDate(date)||!log||typeof log!=='object')continue;
  out.dailyLogs[date]={updatedAt:log.updatedAt||'',notes:String(log.notes||'')};
  for(const key of ['completed','issues','plans'])out.dailyLogs[date][key]=Array.isArray(log[key])?log[key].map(e=>typeof e==='string'?{id:uid(),text:e,updatedAt:''}:{id:e.id??uid(),text:String(e.text||''),updatedAt:e.updatedAt||''}):[];
 }
 out.viewState=validView(obj.viewState)?{start:obj.viewState.start,end:obj.viewState.end,date:obj.viewState.date,scale:obj.viewState.scale}:inferredView(out);
 return out;
}
function newer(a,b){return String(b.updatedAt||'')>String(a.updatedAt||'')?b:a}
function mergeData(incoming){
 const phases=new Map(data.timelineData.map(p=>[String(p.id),p]));
 const owners=new Map();
 for(const p of data.timelineData)for(const t of p.tasks)owners.set(String(t.id),{p,t});
 for(const source of incoming.timelineData){
  let target=phases.get(String(source.id));
  if(!target){target={...source,tasks:[]};data.timelineData.push(target);phases.set(String(target.id),target)}
  else {
   const newerPhase=String(source.updatedAt||'')>String(target.updatedAt||'');
   target.lanes=[...(newerPhase?source.lanes:target.lanes),...(newerPhase?target.lanes:source.lanes).filter(id=>!(newerPhase?source.lanes:target.lanes).includes(id))];
   if(newerPhase){target.phaseName=source.phaseName;target.color=source.color;target.updatedAt=source.updatedAt}
  }
  for(const incomingTask of source.tasks){
   const key=String(incomingTask.id),owned=owners.get(key);
   if(!owned){target.tasks.push(incomingTask);owners.set(key,{p:target,t:incomingTask});continue}
   const {p:oldPhase,t:oldTask}=owned;
   const newIsLater=String(incomingTask.updatedAt||'')>String(oldTask.updatedAt||'');
   const oldSubs=oldTask.subTasks;
   Object.assign(oldTask,newer(oldTask,incomingTask),{subTasks:oldSubs});
   const subs=new Map(oldSubs.map(x=>[String(x.id),x]));
   for(const sub of incomingTask.subTasks){
    const prior=subs.get(String(sub.id));
    if(prior)Object.assign(prior,newer(prior,sub));
    else if(!oldSubs.some(x=>x.text===sub.text&&sub.text)){oldSubs.push(sub);subs.set(String(sub.id),sub)}
   }
   if(newIsLater&&oldPhase!==target){oldPhase.tasks=oldPhase.tasks.filter(x=>x!==oldTask);target.tasks.push(oldTask);owners.set(key,{p:target,t:oldTask})}
  }
 }
 if(String(incoming.phaseOrderUpdatedAt||'')>String(data.phaseOrderUpdatedAt||'')){
  const order=new Map(incoming.timelineData.map((phase,i)=>[String(phase.id),i]));
  data.timelineData.sort((a,b)=>(order.get(String(a.id))??Infinity)-(order.get(String(b.id))??Infinity));
  data.phaseOrderUpdatedAt=incoming.phaseOrderUpdatedAt;
 }
 for(const [date,log] of Object.entries(incoming.dailyLogs)){
  const old=data.dailyLogs[date];if(!old){data.dailyLogs[date]=log;continue}
  if(String(log.updatedAt||'')>String(old.updatedAt||'')){old.notes=log.notes;old.updatedAt=log.updatedAt}
  for(const key of ['completed','issues','plans']){
   const ids=new Map(old[key].map(e=>[String(e.id),e]));
   for(const e of log[key]){
    const match=ids.get(String(e.id));
    if(match)Object.assign(match,newer(match,e));
    else if(!old[key].some(x=>x.text===e.text&&e.text)){old[key].push(e);ids.set(String(e.id),e)}
   }
  }
 }
}
async function importFiles(files,merge){
 try{
  const incoming=[];
  for(const file of files)incoming.push(normalize(JSON.parse(await file.text())));
  const dates=merge?[viewStart,viewEnd,...datesIn(data)]:[];
  for(const item of incoming)dates.push(item.viewState.start,item.viewState.end,...datesIn(item));
  dates.sort();
  const chosenView=merge?{start:dates[0],end:dates.at(-1),date:viewDate,scale}:incoming.length===1?{...incoming[0].viewState}:{
   ...incoming[0].viewState,start:dates[0],end:dates.at(-1)
  };
  mutate(()=>{
   if(!merge){data=incoming.shift();selection=null}
   for(const item of incoming)mergeData(item);
   viewStart=chosenView.start;viewEnd=chosenView.end;viewDate=chosenView.date;scale=chosenView.scale;
   data.version=5;data.viewState={...chosenView};$('zoom-slider').value=scaleToSlider(scale);
  });
  copiedTask=null;
  notify(tr(`已${merge?'合并':'导入'} ${files.length} 个 JSON 文件；请保存新的完整 JSON`,`${merge?'Merged':'Imported'} ${files.length} JSON file(s); save a new complete JSON backup`));
 }catch(error){notify(tr('导入失败：','Import failed: ')+(error?.message||tr('文件无效','Invalid file')))}
}
function askImport(files){
 if(!files.length)return;
 modal(`<h2>${tr(`导入 ${files.length} 个 JSON 文件`,`Import ${files.length} JSON file(s)`)}</h2><p>${tr('请选择如何处理现有数据。合并时相同 ID 会采用更新的条目；不同 ID 会加入，按日期汇合每日记录。','Choose how to handle current data. When merging, matching IDs use the newer entry; new IDs are added and journal entries are combined by date.')}</p><div class="modal-actions"><button data-close>${tr('取消','Cancel')}</button><button id="replace">${tr('替换当前数据','Replace current data')}</button><button id="merge" class="primary">${tr('合并到当前数据','Merge into current data')}</button></div>`);
 $('replace').onclick=()=>{closeModal();importFiles(files,false)};$('merge').onclick=()=>{closeModal();importFiles(files,true)}
}
function highlight(s,q){const str=String(s??''),at=str.toLocaleLowerCase().indexOf(q.toLocaleLowerCase());return at<0?safe(str):safe(str.slice(0,at))+'<mark>'+safe(str.slice(at,at+q.length))+'</mark>'+safe(str.slice(at+q.length))}
function searchItems(q){
 const results=[];
 for(const p of data.timelineData){
  if(p.phaseName.toLocaleLowerCase().includes(q))results.push({kind:'任务',title:p.phaseName,sub:tr('阶段','Phase'),date:p.tasks[0]?.startTime||viewDate,id:p.tasks[0]?.id});
  for(const t of p.tasks){
   for(const [label,value] of [[tr('任务','Task'),t.name],[tr('任务描述','Task description'),t.description||'']])if(value.toLocaleLowerCase().includes(q))results.push({kind:'任务',title:value,sub:`${p.phaseName} · ${t.startTime}—${t.endTime} · ${label}`,date:t.startTime,id:t.id});
   for(const sub of t.subTasks)if((sub.text+' '+(sub.description||'')).toLocaleLowerCase().includes(q))results.push({kind:'子任务',title:sub.text,sub:t.name,date:t.startTime,id:t.id,subId:sub.id})
  }
 }
 for(const [date,log] of Object.entries(data.dailyLogs)){
  for(const key of ['completed','issues','plans'])for(const entry of log[key]||[])if(entry.text.toLocaleLowerCase().includes(q))results.push({kind:'每日记录',title:entry.text,sub:`${date} · ${logLabel(key)}`,date,entryId:entry.id});
  if((log.notes||'').toLocaleLowerCase().includes(q))results.push({kind:'每日记录',title:log.notes,sub:`${date} · ${logLabel('notes')}`,date})
 }
 return results
}
function kindLabel(kind){return prefs.language==='en'?({'全部':'All','任务':'Tasks','每日记录':'Journal','子任务':'Subtasks'}[kind]||kind):kind}
function renderSearch(){
 const q=$('search').value.trim(),panel=$('search-results');if(!q){panel.classList.add('hidden');return}
 const results=searchItems(q);panel.classList.remove('hidden');panel.replaceChildren();
 const head=document.createElement('div');head.innerHTML=`<strong>${tr(`搜索结果 ${results.length}`,`Search results: ${results.length}`)}</strong> <span class="muted small">${tr('点击可跳到对应日期或任务','Click to open the date or task')}</span>`;panel.append(head);
 const tabs=document.createElement('div');tabs.className='tabs';
 for(const type of ['全部','任务','每日记录','子任务']){const button=document.createElement('button');button.textContent=kindLabel(type)+' '+(type==='全部'?results.length:results.filter(r=>r.kind===type).length);button.classList.toggle('active',filter===type);button.onclick=()=>{filter=type;renderSearch()};tabs.append(button)}panel.append(tabs);
 const shown=results.filter(x=>filter==='全部'||x.kind===filter).slice(0,100);
 if(!shown.length){const empty=document.createElement('p');empty.className='muted';empty.textContent=tr('没有匹配内容','No matches');panel.append(empty)}
 for(const r of shown){
  const btn=document.createElement('button');btn.className='result-row';btn.innerHTML=`<span class="small muted">${safe(kindLabel(r.kind))} · ${safe(r.sub)}</span><br>${highlight(r.title,q)}`;
  btn.onclick=()=>{panel.classList.add('hidden');if(r.kind==='每日记录'){selectDate(r.date,true);requestAnimationFrame(()=>{const line=[...document.querySelectorAll('.entry')].find(e=>String(e.dataset.entryId)===String(r.entryId));const target=line||document.querySelector('.notes');target?.scrollIntoView({block:'center'});target?.animate([{outline:'2px solid var(--cursor)'},{outline:'2px solid transparent'}],{duration:1800})})}else if(r.id){selectTask(r.id);if(r.subId)requestAnimationFrame(()=>document.querySelector(`.sub-item[data-sub-id="${CSS.escape(String(r.subId))}"]`)?.scrollIntoView({block:'center'}))}else selectDate(r.date,true)};
  panel.append(btn)
 }
 if(results.length>100&&filter==='全部'){const note=document.createElement('p');note.className='muted';note.textContent=tr('仅显示前 100 条，请输入更多关键词','Showing the first 100 results; enter more keywords to narrow the search');panel.append(note)}
}
function showSettings(){
 modal(`<h2>${tr('外观设置','Appearance settings')}</h2><label>${tr('界面语言','Interface language')} <select id="language"><option value="zh">简体中文</option><option value="en">English</option></select></label><p class="small muted">${tr('切换语言不会翻译已输入的任务名称或记录内容。','Switching languages does not translate your task names or journal entries.')}</p><label>${tr('主题预设','Theme preset')} <select id="theme"><option value="暗色">${tr('暗色','Dark')}</option><option value="浅色">${tr('浅色','Light')}</option><option value="柔和">${tr('柔和','Soft')}</option><option value="自定义">${tr('自定义','Custom')}</option></select></label><p class="small muted">${tr('阶段颜色可直接点击时间轴左侧的小方块修改。','Click a square beside a phase to change its color.')}</p><h3>${tr('显示大小','Display size')}</h3><div class="display-scale"><label for="ui-scale">${tr('界面缩放','UI scale')}</label><input id="ui-scale" type="range" min="75" max="125" step="5"><output id="ui-scale-value" for="ui-scale"></output></div><div class="display-scale"><label for="font-scale">${tr('字体大小','Font size')}</label><input id="font-scale" type="range" min="80" max="140" step="5"><output id="font-scale-value" for="font-scale"></output></div><button id="reset-display" type="button" class="quiet">${tr('恢复显示默认值','Reset display size')}</button><p class="small muted">${tr('界面、字体和时间轴缩放分别设置。','UI, font, and timeline zoom are independent.')}</p><h3>${tr('界面颜色','Interface colors')}</h3><div class="settings-grid" id="settings-grid"></div><h3>${tr('常用按钮','Main buttons')}</h3><div class="settings-grid" id="button-colors"></div><div class="modal-actions"><button data-close>${tr('完成','Done')}</button></div>`);
 $('language').value=prefs.language;$('theme').value=prefs.theme;
 $('language').onchange=()=>{const value=$('language').value;if(!['zh','en'].includes(value))return;prefs.language=value;persistPrefs();localizeStatic();render();showSettings()};
 for(const [id,key] of [['ui-scale','uiScale'],['font-scale','fontScale']]){const slider=$(id),output=$(id+'-value');slider.value=prefs[key];output.value=prefs[key]+'%';slider.oninput=()=>{prefs[key]=Number(slider.value);output.value=prefs[key]+'%';persistPrefs();if(key==='fontScale')renderTimeline()}}
 $('reset-display').onclick=()=>{prefs.uiScale=100;prefs.fontScale=100;persistPrefs();renderTimeline();for(const [id,key] of [['ui-scale','uiScale'],['font-scale','fontScale']]){$(id).value=prefs[key];$(id+'-value').value=prefs[key]+'%'}};
 const colors=$('settings-grid'),buttons=$('button-colors');
 function draw(){
  colors.replaceChildren();
  const names=prefs.language==='en'?['Background','Panel','Main text','Secondary text','Grid lines','Month divider','Today line','Date cursor','In progress','Issue','Incomplete','Completed']:themeNames;
  names.forEach((name,i)=>{const line=document.createElement('label');line.className='color-field';line.textContent=name;const input=document.createElement('input');input.type='color';input.value=prefs.colors[i];input.oninput=()=>{prefs.colors[i]=input.value;prefs.theme='自定义';$('theme').value='自定义';persistPrefs()};line.append(input);colors.append(line)});
  buttons.replaceChildren();
  for(const [key,name] of [['saveColor',tr('保存 JSON 按钮','Save JSON button')],['taskColor',tr('添加任务按钮','Add task button')]]){const line=document.createElement('label');line.className='color-field';line.textContent=name;const input=document.createElement('input');input.type='color';input.value=prefs[key];input.oninput=()=>{prefs[key]=input.value;prefs.theme='自定义';$('theme').value='自定义';persistPrefs()};line.append(input);buttons.append(line)}
 }
 draw();
 $('theme').onchange=()=>{const name=$('theme').value;if(themes[name]){prefs.theme=name;prefs.colors=themes[name].slice();prefs.saveColor=buttonThemes[name].save;prefs.taskColor=buttonThemes[name].task;persistPrefs();draw()}}
}
function splitter(el,axis){let initial=null;el.addEventListener('pointerdown',e=>{initial={x:e.clientX,y:e.clientY,width:$('journal').getBoundingClientRect().width,height:$('details').getBoundingClientRect().height};el.setPointerCapture(e.pointerId);e.preventDefault()});el.addEventListener('pointermove',e=>{if(!initial)return;if(axis==='x'){prefs.journalCollapsed=false;const width=Math.max(280,Math.min(window.innerWidth*.55,initial.width+initial.x-e.clientX));prefs.journalWidth=width/$('workspace').clientWidth*100}else{prefs.detailsCollapsed=false;const height=Math.max(52,Math.min($('left').clientHeight-120,initial.height+initial.y-e.clientY));prefs.detailsHeight=height/$('left').clientHeight*100}applyPrefs()});el.addEventListener('pointerup',()=>{if(initial){initial=null;persistPrefs();renderTimeline()}});el.addEventListener('dblclick',()=>{if(axis==='x')prefs.journalWidth=30;else prefs.detailsHeight=35;persistPrefs();renderTimeline()})}
function setupPan(){let state=null;const sc=$('timeline-scroll');sc.addEventListener('wheel',e=>{if(!e.altKey)return;e.preventDefault();const dy=Math.max(-240,Math.min(240,e.deltaY*(e.deltaMode===1?16:1)));zoomTo(scale*Math.exp(-dy*.0015),e.clientX)},{passive:false});sc.addEventListener('pointerdown',e=>{if(e.target.closest('.task-bar,.track-name,.ruler'))return;state={x:e.clientX,left:sc.scrollLeft,moved:false};sc.setPointerCapture(e.pointerId)});sc.addEventListener('pointermove',e=>{if(!state)return;if(Math.abs(e.clientX-state.x)>3)state.moved=true;if(state.moved)sc.scrollLeft=state.left+state.x-e.clientX});sc.addEventListener('pointerup',()=>state=null);let drag=false;$('ruler').addEventListener('pointerdown',e=>{e.preventDefault();drag=true;$('ruler').setPointerCapture(e.pointerId);rulerAt(e)});$('ruler').addEventListener('pointermove',e=>{if(drag)rulerAt(e)});$('ruler').addEventListener('pointerup',()=>drag=false);$('ruler').addEventListener('pointercancel',()=>drag=false);function rulerAt(e){const rect=$('ruler').getBoundingClientRect(),index=Math.max(0,Math.min(dayDiff(viewStart,viewEnd),Math.floor((e.clientX-rect.left)/scale)));selectDate(addDays(viewStart,index),false)}}
function init(){
 applyPrefs();localizeStatic();$('zoom-slider').value=scaleToSlider(scale);
 $('save').onclick=save;$('export-md').onclick=exportMarkdown;$('import').onclick=()=>$('file-input').click();
 $('file-input').onchange=e=>{askImport([...e.target.files]);e.target.value=''};
 $('new-project').onclick=()=>confirmAction(tr('新建工作区','New workspace'),tr('当前工作区会从页面中清空。若有未保存修改，请先导出 JSON。','The current workspace will be cleared from this page. Save a JSON backup first if you have unsaved changes.'),()=>{mutate(()=>{data=fresh(prefs.language);selection=null;viewDate=today();viewStart=addDays(viewDate,-7);viewEnd=addDays(viewDate,30);scale=52;$('zoom-slider').value=scaleToSlider(scale)});copiedTask=null});
 $('workspace-name').onfocus=()=>editingSnapshot=snapshot();
 $('workspace-name').oninput=e=>{data.projectName=e.target.value;setDirty();document.title=data.projectName+tr(' · 工作时间轴',' · Work Timeline')};
 $('workspace-name').onblur=()=>{if(!data.projectName.trim())data.projectName=tr('工作记录','Work Record');flushEdit()};
 $('add-phase').onclick=()=>showPhaseModal();$('add-task').onclick=showTaskModal;$('settings').onclick=showSettings;$('search').oninput=renderSearch;
 $('prev-day').onclick=$('journal-prev').onclick=()=>selectDate(addDays(viewDate,-1),true);
 $('next-day').onclick=$('journal-next').onclick=()=>selectDate(addDays(viewDate,1),true);
 $('jump-today').onclick=$('journal-today').onclick=()=>selectDate(today(),true);
 $('journal-date').onchange=$('axis-date').onchange=e=>selectDate(e.target.value,true);
 $('zoom-slider').oninput=e=>zoomTo(sliderToScale(e.target.value));$('zoom-in').onclick=()=>stepZoom(1);$('zoom-out').onclick=()=>stepZoom(-1);$('set-range').onclick=setViewRange;
 $('copy-yesterday').onclick=()=>{
  const previous=getLog(addDays(viewDate,-1)).plans.filter(x=>x.text.trim());if(!previous.length){notify(tr('昨天没有可载入的明日计划','No plan from yesterday to copy'));return}
  mutate(()=>{const current=ensureLog(viewDate),known=new Set(current.completed.map(x=>x.text));for(const plan of previous)if(!known.has(plan.text)){current.completed.push({id:uid(),text:plan.text,updatedAt:stamp()});known.add(plan.text)}current.updatedAt=stamp()});notify(tr('已载入昨日计划','Copied yesterday’s plan'))
 };
 $('journal-toggle').onclick=()=>{prefs.journalCollapsed=!prefs.journalCollapsed;persistPrefs();renderTimeline()};
 $('related-toggle').onclick=()=>{prefs.relatedCollapsed=!prefs.relatedCollapsed;persistPrefs()};
 $('detail-toggle').onclick=()=>{prefs.detailsCollapsed=!prefs.detailsCollapsed;persistPrefs();renderTimeline()};
 $('modal-cover').onclick=e=>{if(e.target===$('modal-cover'))closeModal()};
 splitter($('split-h'),'x');splitter($('split-v'),'y');setupPan();
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('search-results').classList.add('hidden')}const taskShortcutReady=!editingText(e.target)&&$('modal-cover').classList.contains('hidden');if(e.key==='Delete'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&taskShortcutReady&&confirmDeleteTask(selection)){e.preventDefault();return}if((e.ctrlKey||e.metaKey)&&!e.altKey){const key=e.key.toLowerCase();if((key==='c'||key==='v')&&!e.shiftKey&&taskShortcutReady){if((key==='c'?copySelectedTask():pasteCopiedTask())){e.preventDefault();return}}if(key==='s'){e.preventDefault();save()}else if(key==='f'){e.preventDefault();$('search').focus();$('search').select()}else if(key==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(key==='y'){e.preventDefault();redo()}}});
 window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
 window.addEventListener('resize',()=>renderTimeline());render();requestAnimationFrame(()=>centerDate(viewDate))
}
init();
})();
